# Deployment del servicio de inferencia: 3 réplicas del contenedor riesgo-api:2.0.
# Cada Pod descarga al arrancar models:/riesgo-credito@champion desde el servidor MLflow (http://mlflow:5000).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: riesgo-api
  labels:
    app: riesgo-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: riesgo-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0   # nunca baja de 3 réplicas listas durante una actualización
      maxSurge: 1
  template:
    metadata:
      labels:
        app: riesgo-api
    spec:
      containers:
        - name: api
          image: riesgo-api:2.0
          imagePullPolicy: IfNotPresent   # la imagen se carga en kind con "kind load docker-image"
          ports:
            - containerPort: 8000
          env:
            - name: POD_NAME              # Downward API: el nombre del Pod viaja en cada respuesta
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: MLFLOW_TRACKING_URI
              value: http://mlflow:5000
            - name: MODELO_NOMBRE
              value: riesgo-credito
            - name: MODELO_ALIAS
              value: champion
          resources:                      # requests = limits -> QoS Guaranteed (medido: ~190 MiB en reposo)
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 250m
              memory: 512Mi
          startupProbe:                   # da hasta 2 min para descargar y cargar el modelo
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:                 # solo recibe tráfico si el modelo del registro está cargado
            httpGet:
              path: /ready
              port: 8000
            periodSeconds: 5
          livenessProbe:                  # si el proceso deja de responder, Kubernetes lo reinicia
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            failureThreshold: 3
