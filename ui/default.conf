# nginx de la interfaz: sirve index.html y reenvía /api/* al Service riesgo-api del clúster.
# Sin keepalive hacia la API: cada petición abre conexión nueva y kube-proxy la reparte entre los Pods.
server {
    # Puerto interno de nginx; coincide con targetPort en k8s/ui.yaml.
    listen 8080;
    # Las rutas normales entregan la página web.
    location / {
        root /usr/share/nginx/html;
        index index.html;
    }
    # Las rutas /api/ se reenvían a la API.
    location /api/ {
        # Nombre DNS del Service. La barra final quita /api de la ruta.
        proxy_pass http://riesgo-api.default.svc.cluster.local/;
        # Conserva el host original de la petición.
        proxy_set_header Host $host;
    }
}
